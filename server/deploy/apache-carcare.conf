# ติดตั้ง carcare ใต้ path ย่อยของเว็บที่มีโปรเจกต์อื่นอยู่แล้ว
#
# วางไฟล์นี้ที่ /etc/apache2/conf-available/carcare.conf แล้วสั่ง
#   sudo a2enconf carcare && sudo systemctl reload apache2
#
# ตัวโค้ดอยู่นอก document root ของโฮสต์ (/var/www/carcare) และเปิดให้เข้าถึง
# เฉพาะโฟลเดอร์ public/ เท่านั้น — config.php ที่มีรหัสผ่านฐานข้อมูลจึงอยู่นอก
# ขอบเขตที่เว็บเซิร์ฟเวอร์เสิร์ฟได้ ต่อให้ตั้ง Alias ผิดก็ยังหลุดออกไปไม่ได้

Alias /carcare /var/www/carcare/public

<Directory /var/www/carcare/public>
    Options -Indexes +FollowSymLinks
    # ต้องเปิดเพื่อให้ .htaccess ที่ทำ rewrite ของ /api ทำงาน
    AllowOverride All
    Require all granted

    # บอกแอพว่าถูกติดตั้งไว้ใต้ path ไหน ใช้ประกอบลิงก์และ path ของคุกกี้
    # ตั้งตรงนี้ที่เดียว ดีกว่าให้ PHP เดาเอาจาก SCRIPT_NAME ซึ่งเปลี่ยนไปตาม rewrite
    SetEnv CARCARE_BASE /carcare

    # เปิดบรรทัดนี้เมื่ออยู่หลัง reverse proxy ที่จบ TLS ให้ (เช่น Cloudflare)
    # เพื่อให้คุกกี้เซสชันได้ธง Secure ตามที่เบราว์เซอร์ใช้จริง
    # ห้ามเปิดถ้าเข้าถึงเซิร์ฟเวอร์นี้ตรง ๆ ได้ เพราะ X-Forwarded-Proto ปลอมได้
    #SetEnv CARCARE_TRUST_PROXY 1
</Directory>
