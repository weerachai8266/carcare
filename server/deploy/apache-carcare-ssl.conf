# รับ https ให้ carcare.mtflows.com โดยใช้ Cloudflare Origin Certificate
#
# วางไฟล์นี้ที่ /etc/apache2/sites-available/carcare-ssl.conf แล้วสั่ง
#   sudo a2enmod ssl
#   sudo a2ensite carcare-ssl
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# ทำไมต้องมี ทั้งที่ Cloudflare จบ TLS ให้อยู่แล้ว:
# ถ้า Cloudflare ต่อมาที่เราด้วย http เปล่า (โหมด Flexible) โทเคนเซสชันของผู้ใช้
# จะวิ่งเป็น cleartext บนช่วง Cloudflare→เซิร์ฟเวอร์ ซึ่งเป็นอินเทอร์เน็ตจริง
# ใบรับรองของ Cloudflare (Origin Certificate) ใช้ฟรี อายุ 15 ปี ไม่ต้องต่ออายุ
# และเบราว์เซอร์ไม่ต้องเชื่อถือมันเพราะไม่มีใครต่อตรงมาที่เครื่องนี้อยู่แล้ว
#
# DocumentRoot ชี้ที่เดียวกับ vhost พอร์ต 80 เพื่อให้ Alias /carcare ที่ตั้งไว้
# ระดับเซิร์ฟเวอร์ (conf-enabled/carcare.conf) ทำงานเหมือนกันทั้งสองพอร์ต
# ไม่ต้องมีคอนฟิกของแอพสองชุดให้หลุดกันทีหลัง

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName carcare.mtflows.com

    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/carcare.mtflows.com.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/carcare.mtflows.com.key

    ErrorLog  ${APACHE_LOG_DIR}/carcare-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/carcare-ssl-access.log combined
</VirtualHost>
</IfModule>
